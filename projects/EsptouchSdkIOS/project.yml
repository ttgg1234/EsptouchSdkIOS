name: EsptouchSDK
options:
  bundleIdPrefix: com.ibreezee
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  EsptouchSDK:
    type: framework
    platform: iOS
    sources:
      - path: EsptouchSDK
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibreezee.esptouchsdk
        INFOPLIST_FILE: EsptouchSDK/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  EsptouchDemo:
    type: application
    platform: iOS
    sources:
      - path: EsptouchDemo
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibreezee.esptouchdemo
        INFOPLIST_FILE: EsptouchDemo/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    dependencies:
      - target: EsptouchSDK
    entitlements:
      path: EsptouchDemo/EsptouchDemo.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true
        com.apple.developer.networking.multicast: true

name: Build iOS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build iOS Project
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Show repo structure
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== All directories (3 levels) ==="
          find . -maxdepth 3 -type d | head -50

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: projects/EsptouchSdkIOS
        run: xcodegen generate

      - name: Build EsptouchSDK Framework
        working-directory: projects/EsptouchSdkIOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project EsptouchSDK.xcodeproj \
            -scheme EsptouchSDK \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -50

      - name: Build EsptouchDemo App
        working-directory: projects/EsptouchSdkIOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project EsptouchSDK.xcodeproj \
            -scheme EsptouchDemo \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -50

      - name: Debug - Show DerivedData structure
        working-directory: projects/EsptouchSdkIOS
        run: |
          echo "=== DerivedData directories ==="
          find build/DerivedData -type d -maxdepth 5 | head -80
          echo ""
          echo "=== All .framework files ==="
          find build/DerivedData -name "*.framework" -type d 2>/dev/null || echo "No frameworks found"
          echo ""
          echo "=== All .app files ==="
          find build/DerivedData -name "*.app" -type d 2>/dev/null || echo "No apps found"
          echo ""
          echo "=== Build/Products directory ==="
          find build/DerivedData/Build/Products -type d -maxdepth 3 2>/dev/null || echo "No Products directory"

      - name: Prepare artifacts
        working-directory: projects/EsptouchSdkIOS
        run: |
          mkdir -p build-output

          # 复制 SDK Framework
          FRAMEWORK_PATH=$(find build/DerivedData -name "EsptouchSDK.framework" -type d | head -1)
          if [ -n "$FRAMEWORK_PATH" ]; then
            cp -R "$FRAMEWORK_PATH" build-output/
            echo "Copied: $FRAMEWORK_PATH"
          else
            echo "WARNING: EsptouchSDK.framework not found"
          fi

          # 复制 Demo App
          APP_PATH=$(find build/DerivedData -name "EsptouchDemo.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" build-output/
            echo "Copied: $APP_PATH"
          else
            echo "WARNING: EsptouchDemo.app not found"
          fi

          echo "=== Build Output ==="
          ls -la build-output/ 2>/dev/null || echo "build-output is empty"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EsptouchSDK-iOS-Build
          path: projects/EsptouchSdkIOS/build-output/
          retention-days: 30
